name: "Push images to Azure Container Registry"

# Builds the service images and pushes them to ACR.
# Setup (Azure resources + GitHub variables): docs/azure-acr.md

on:
  push:
    branches: [ "main" ]
    paths:
      - "cart/**"
      - "stocks/**"
      - "metrics-consumer/**"
      - "go.work"
      - ".github/workflows/azure-acr.yml"
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for azure/login
  contents: read

concurrency:
  group: azure-acr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    environment: azure
    strategy:
      fail-fast: false
      matrix:
        service: [ cart, stocks, metrics-consumer ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ github.sha }}
            ${{ vars.ACR_NAME }}.azurecr.io/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
